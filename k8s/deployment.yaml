apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-assignment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-assignment

  template:

    metadata:
      labels:
        app: devops-assignment

    spec:

      containers:

        - name: devops-assignment

          image: devops-assignment:latest

          imagePullPolicy: Never

          ports:

            - containerPort: 5000

          envFrom:

            - configMapRef:
                name: devops-app-config

          readinessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 10

            periodSeconds: 20